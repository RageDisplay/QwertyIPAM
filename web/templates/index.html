<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VectrixIPAM</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>VectrixIPAM</h1>
  <p class="subtitle">Учёт IP-адресов и подсетей</p>
</header>

<main>
  <section class="panel">
    <h2>Подсети</h2>
    <form id="subnet-form" class="inline-form">
      <input type="text" id="subnet-cidr" placeholder="192.168.1.0/24" required pattern="^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$">
      <input type="text" id="subnet-desc" placeholder="Описание">
      <input type="text" id="subnet-vlan" placeholder="VLAN">
      <button type="submit">Добавить подсеть</button>
    </form>
    <table id="subnets-table">
      <thead>
        <tr><th>CIDR</th><th>Описание</th><th>VLAN</th><th>Адресов</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="panel" id="addresses-panel" hidden>
    <div class="panel-header">
      <h2>Адреса подсети: <span id="current-subnet-label"></span></h2>
      <div class="actions">
        <button id="discover-btn">Обнаружить адреса</button>
        <button id="add-address-btn">Добавить вручную</button>
      </div>
    </div>
    <p id="discover-status" class="status" hidden></p>
    <table id="addresses-table">
      <thead>
        <tr>
          <th>IP</th><th>Имя хоста</th><th>MAC</th><th>Статус</th>
          <th>Владелец</th><th>Заметки</th><th>Последний отклик</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<dialog id="address-dialog">
  <form id="address-form" method="dialog">
    <h3>Адрес</h3>
    <input type="hidden" id="addr-id">
    <label>IP <input type="text" id="addr-ip" required></label>
    <label>Имя хоста <input type="text" id="addr-hostname"></label>
    <label>MAC <input type="text" id="addr-mac"></label>
    <label>Статус
      <select id="addr-status">
        <option value="used">used</option>
        <option value="free">free</option>
        <option value="reserved">reserved</option>
      </select>
    </label>
    <label>Владелец <input type="text" id="addr-owner"></label>
    <label>Заметки <textarea id="addr-notes"></textarea></label>
    <div class="dialog-actions">
      <button type="button" id="addr-cancel">Отмена</button>
      <button type="submit" id="addr-save">Сохранить</button>
    </div>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
